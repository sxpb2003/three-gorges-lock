<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>三峡永久船闸 · 三维开挖动画</title>
<style>
  :root{--bg:#070b10;--txt:#dceaf6;--dim:#8aa0b2;--acc:#55c2ff}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;overflow:hidden}
  canvas{display:block}
  #hd{position:fixed;left:18px;top:14px;z-index:8;pointer-events:none}
  #hd h1{margin:0;font-size:19px;letter-spacing:1px}
  #hd h1 span{color:var(--dim);font-weight:400;font-size:13px}
  #hd p{margin:4px 0 0;font-size:11.5px;color:var(--dim)}
  #hud{position:fixed;left:50%;transform:translateX(-50%);top:70px;z-index:9;text-align:center;
    background:rgba(6,12,18,.85);border:1px solid rgba(85,194,255,.32);border-radius:10px;padding:10px 18px;font-size:13px;line-height:1.7}
  #hud b{color:#ffd166}
  #hud .sub{color:#9fd6ff;font-size:12px}
  #tl{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;z-index:9;display:flex;align-items:center;gap:12px;
    background:rgba(6,12,18,.85);border:1px solid rgba(85,194,255,.32);border-radius:10px;padding:10px 16px;font-size:12.5px}
  #tl #pl{cursor:pointer;border:1px solid rgba(85,194,255,.4);border-radius:6px;padding:2px 10px;color:#8fe0ff}
  #tl input[type=range]{width:260px}
  #tl .ym{color:#ffd166;font-weight:700;font-size:15px;min-width:78px;text-align:center}
  #tl .nv{color:#9fb6c8;min-width:150px;text-align:right}
  #tl .qb{cursor:pointer;border:1px solid rgba(85,194,255,.35);border-radius:6px;padding:2px 8px;color:#bfe6ff}
  @media (max-width:900px){
    #hud{top:58px;font-size:11.5px;padding:7px 10px;max-width:92vw}
    #tl{bottom:12px;gap:6px;padding:7px 9px;font-size:11px;max-width:96vw}
    #tl input[type=range]{width:110px}
    #tl .ym{font-size:12.5px;min-width:62px}
    #tl .nv{min-width:0;font-size:10.5px}
    #tl .qb{display:none}
  }
</style>
</head>
<body>
<div id="hd">
  <h1>三峡永久船闸 <span>· 三维开挖动画</span></h1>
  <p>12 m 一块 · 10 m 一层 · 抽槽 24 m + 保护层 3 m + 道路 10 m</p>
</div>
<div id="hud">
  <div><b id="mth">开工前</b>　本月开挖 <b id="mv">0</b> 万m³</div>
  <div class="sub">累计 <b id="cv">0</b> / 508.7 万m³（<span id="cp">0.0%</span>）　当前：<span id="loc">—</span></div>
</div>
<div id="tl">
  <span id="pl">▶</span>
  <input type="range" id="sl" min="0" max="26" value="0">
  <span class="ym" id="ym">开工前</span>
  <span class="nv" id="nv">0 / 508.7 万m³</span>
  <span class="qb" id="qb0">开工前</span>
  <span class="qb" id="qb1">全部完成</span>
</div>

<script type="importmap">
{"imports":{"three":"./vendor/three.module.js"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from './vendor/controls/OrbitControls.js';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x070b10);
scene.fog = new THREE.Fog(0x070b10, 2200, 5200);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.5, 30000);
camera.position.set(1300, 900, 1150);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enablePan = true;
controls.screenSpacePanning = true;
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minPolarAngle = 0;
controls.maxPolarAngle = Math.PI / 2;
controls.minDistance = 20;
controls.maxDistance = 5000;

const CX = (14950 + 16660) / 2;
const CZ = 0;

scene.add(new THREE.HemisphereLight(0xcfe4ff, 0x22303a, 1.1));
const dl = new THREE.DirectionalLight(0xffffff, 1.6);
dl.position.set(600, 1200, 900);
scene.add(dl);
const dl2 = new THREE.DirectionalLight(0xffffff, 0.5);
dl2.position.set(-900, 700, -600);
scene.add(dl2);

// 网格地面
const grid = new THREE.GridHelper(3000, 60, 0x1b3a52, 0x122736);
grid.position.set(CX, 40, CZ);
scene.add(grid);

let blocks = [], meta = null, inst = null;
const dummy = new THREE.Matrix4();
const q0 = new THREE.Quaternion();
const zero = new THREE.Vector3(0, 0, 0);

const COLORS = { '抽槽': 0x8d8577, '保护层': 0xa39a89, '道路': 0x6f6a60 };

fetch('excav_blocks.json').then(r => r.json()).then(d => {
  meta = d.meta;
  blocks = d.blocks;
  const geo = new THREE.BoxGeometry(1, 1, 1);
  const mat = new THREE.MeshStandardMaterial({ roughness: 0.95, metalness: 0.02, vertexColors: false });
  inst = new THREE.InstancedMesh(geo, mat, blocks.length);
  inst.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  const col = new THREE.Color();
  blocks.forEach((b, i) => {
    col.setHex(COLORS[b.strip] || 0x8d8577);
    // 按闸室略微区分亮度
    const f = 1 + (b.c - 2) * 0.035;
    col.multiplyScalar(f);
    inst.setColorAt(i, col);
  });
  inst.instanceColor.needsUpdate = true;
  scene.add(inst);
  applyMonth(0);
  fitCamera();
}).catch(e => { document.getElementById('mth').textContent = '数据加载失败'; });

function applyMonth(t) {
  // t = 0 表示开工前（全部实体）；t = k 表示第 k 个月末
  let vol = 0, last = null;
  blocks.forEach((b, i) => {
    const done = b.m < t;
    if (done) { vol += b.v; last = b; }
    const sx = done ? 0 : (b.x1 - b.x0);
    const sy = done ? 0 : (b.z1 - b.z0);
    const sz = done ? 0 : (b.y1 - b.y0);
    dummy.compose(new THREE.Vector3((b.x0 + b.x1) / 2, (b.z0 + b.z1) / 2, (b.y0 + b.y1) / 2),
                  q0, new THREE.Vector3(sx, sy, sz));
    inst.setMatrixAt(i, dummy);
  });
  inst.instanceMatrix.needsUpdate = true;
  const m = meta.perMonth;
  const thisMonth = (t >= 1 && t <= m.length) ? m[t - 1] : 0;
  const total = meta.total;
  document.getElementById('sl').value = t;
  document.getElementById('ym').textContent = t === 0 ? '开工前' : meta.months[t - 1];
  document.getElementById('mth').textContent = t === 0 ? '开工前' : meta.months[t - 1];
  document.getElementById('mv').textContent = (thisMonth / 1e4).toFixed(1);
  document.getElementById('cv').textContent = (vol / 1e4).toFixed(1);
  document.getElementById('cp').textContent = (vol / total * 100).toFixed(1) + '%';
  document.getElementById('nv').textContent = (vol / 1e4).toFixed(1) + ' / ' + (total / 1e4).toFixed(1) + ' 万m³';
  document.getElementById('loc').textContent = last
    ? ('第' + '一二三四五'[last.c] + '闸室 · ' + (last.line > 0 ? '北线' : '南线') + ' · 第' + last.layer + '层 · ' + last.strip)
    : '—';
}

function fitCamera() {
  camera.position.set(CX + 900, 900, 1250);
  controls.target.set(CX, 120, 0);
  controls.update();
}

let timer = null, t = 0;
function play() {
  const btn = document.getElementById('pl');
  if (timer) { clearInterval(timer); timer = null; btn.textContent = '▶'; return; }
  btn.textContent = '❚❚';
  if (t >= meta.months.length) t = 0;
  timer = setInterval(() => {
    if (t >= meta.months.length) { clearInterval(timer); timer = null; document.getElementById('pl').textContent = '▶'; return; }
    t++; applyMonth(t);
  }, 900);
}
document.getElementById('pl').onclick = play;
document.getElementById('sl').oninput = function () { if (timer) { clearInterval(timer); timer = null; document.getElementById('pl').textContent = '▶'; } t = parseInt(this.value, 10); applyMonth(t); };
document.getElementById('qb0').onclick = function () { if (timer) { clearInterval(timer); timer = null; document.getElementById('pl').textContent = '▶'; } t = 0; applyMonth(0); };
document.getElementById('qb1').onclick = function () { if (timer) { clearInterval(timer); timer = null; document.getElementById('pl').textContent = '▶'; } t = meta.months.length; applyMonth(t); };

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

function loop() {
  requestAnimationFrame(loop);
  controls.update();
  renderer.render(scene, camera);
}
loop();
</script>
</body>
</html>
